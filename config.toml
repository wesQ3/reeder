# Reeder Configuration

[paths]
# Base directory for reeder data (absolute path)
base_dir = "/var/lib/reeder"

# Subdirectories (relative to base_dir)
inbox = "inbox"
processing = "processing"
done = "done"
audio = "www/audio"
www = "www"
voices = "voices"
status_file = "var/status.txt"
db = "var/reeder.db"
artifacts = "var/artifacts"
logs = "var/logs"

[jobs]
# push = legacy inbox/systemd.path path; pull = SQLite queue + orchestrator.
# Use "dual" during migration only if the legacy path unit is disabled.
mode = "push"
lease_seconds = 180
heartbeat_seconds = 15
claim_wait_seconds = 30
max_attempts = 2
retention_days = 90
local_tts_fallback = false

[jobs.worker_api]
# Name of the environment variable holding the shared worker bearer token.
token_env = "REEDER_WORKER_TOKEN"
max_artifact_mb = 4096
# Comma-separated extra origins are not needed for same-origin form use.
cors_origins = ""

[tts]
# Default voice file (relative to voices dir, or absolute path)
default_voice = "default.safetensors"

# TTS model (HuggingFace model ID or local path)
model = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"

# Default TTS parameters
temperature = 0.8
device = "cpu"

# Output format: "opus" or "mp3"
# opus = smaller files, modern format
# mp3 = maximum compatibility with podcast apps
audio_format = "opus"

# Opus encoding bitrate (kbps)
opus_bitrate = 48

# MP3 encoding bitrate (kbps) 
mp3_bitrate = 64

[tts.remote]
# Remote GPU worker (enable in local override if used)
enabled = false
url = "http://localhost:8100"
timeout = 300
wake_enabled = false
wake_mac = ""
wake_broadcast = "255.255.255.255"
wake_port = 9
wake_retries = 5
wake_retry_interval = 1.0
wake_wait = 60
wake_poll_interval = 3

[feed]
# RSS feed metadata
title = "Reeder"
description = "Articles converted to audio"
author = "Reeder TTS"
language = "en-us"

# Base URL for audio files and feed (set on deploy host)
# Example: "https://myserver.tail1234.ts.net/reeder"
base_url = "http://localhost:8080"

# Feed image (1400x1400 to 3000x3000 recommended for podcast apps)
# Place in www/ directory
image = "cover.jpg"

[server]
# Static file server settings (if using built-in server)
host = "0.0.0.0"
port = 8080

[extractors]
# Default extractor for URL jobs
default = "trafilatura"

# Site-specific extractors (domain -> pup selector)
# Uncomment and customize for sites you frequently read
# [extractors.sites]
# "news.ycombinator.com" = "td.title a"
# "example.com" = "article .content p text{}"
