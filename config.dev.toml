# Development config - paths relative to repo root
# Copy to config.toml and adjust for production

[paths]
# For development, use current directory
base_dir = "."

inbox = "inbox"
processing = "processing"
done = "done"
audio = "www/audio"
www = "www"
voices = "voices"
status_file = "var/status.txt"

[tts]
default_voice = "default.safetensors"
model = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
temperature = 0.8
device = "cpu"
audio_format = "opus"
opus_bitrate = 48
mp3_bitrate = 64

[tts.remote]
# Remote GPU worker (disabled for local dev)
enabled = false
url = "http://localhost:8100"
timeout = 300
# Wake-on-LAN: EXPERIMENTAL — does not work on all networks/hardware.
# Disabled by default; enable only after verifying magic packets reach the host.
[tts.remote.wake]
enabled = false
mac = ""
broadcast = "255.255.255.255"
port = 9
retries = 5
retry_interval = 1.0
wait = 60
poll_interval = 3

[feed]
title = "Reeder (Dev)"
description = "Articles converted to audio"
author = "Reeder TTS"
language = "en-us"
base_url = "http://localhost:8080"
image = "cover.jpg"

[server]
host = "0.0.0.0"
port = 8080

[extractors]
default = "trafilatura"
