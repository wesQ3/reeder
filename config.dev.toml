# Development config - paths relative to repo root
# Copy to config.toml and adjust for production

[paths]
# For development, use current directory
base_dir = "."

inbox = "inbox"
processing = "processing"
done = "done"
audio = "www/audio"
www = "www"
voices = "voices"
status_file = "var/status.txt"
db = "var/reeder.db"
artifacts = "var/artifacts"
logs = "var/logs"

[jobs]
# push = legacy inbox/systemd.path path; pull = SQLite queue + orchestrator.
# Use "dual" during migration only if the legacy path unit is disabled.
mode = "push"
lease_seconds = 180
heartbeat_seconds = 15
claim_wait_seconds = 30
max_attempts = 2
retention_days = 90
local_tts_fallback = false

[jobs.worker_api]
# Name of the environment variable holding the shared worker bearer token.
token_env = "REEDER_WORKER_TOKEN"
max_artifact_mb = 4096
# Comma-separated extra origins are not needed for same-origin form use.
cors_origins = ""

[tts]
default_voice = "default.safetensors"
model = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
temperature = 0.8
device = "cpu"
audio_format = "opus"
opus_bitrate = 48
mp3_bitrate = 64

[tts.remote]
# Remote GPU worker (disabled for local dev)
enabled = false
url = "http://localhost:8100"
timeout = 300
wake_enabled = false
wake_mac = ""
wake_broadcast = "255.255.255.255"
wake_port = 9
wake_retries = 5
wake_retry_interval = 1.0
wake_wait = 60
wake_poll_interval = 3

[feed]
title = "Reeder (Dev)"
description = "Articles converted to audio"
author = "Reeder TTS"
language = "en-us"
base_url = "http://localhost:8080"
image = "cover.jpg"

[server]
host = "0.0.0.0"
port = 8080

[extractors]
default = "trafilatura"
