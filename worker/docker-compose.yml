services:
  tts-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reeder-tts-worker
    restart: unless-stopped
    # NOTE: .env is used by compose for host-side substitution only.
    # Do not load it via env_file: it contains host paths (VOICES_DIR,
    # MODELS_DIR) that must never leak into the container environment.
    ports:
      - "8100:8100"       # Reeder compatibility endpoint
      - "8080:8080"       # audio.cpp WebUI / Arena
    volumes:
      - ${VOICES_DIR:-/var/lib/reeder/voices}:/data/voices:ro
      # /app/models is audio.cpp's default models root; mounting it writable
      # lets the embedded WebUI download and manage models there directly.
      - ${MODELS_DIR:-/var/lib/reeder/models}:/app/models
    environment:
      - ACTIVE_TTS_MODEL=${ACTIVE_TTS_MODEL:-qwen3-tts}
      - AUDIOCPP_BACKEND=${AUDIOCPP_BACKEND:-cuda}
      # Chunking & runaway-generation detection tuning (all optional)
      - CHARS_PER_TOKEN=${CHARS_PER_TOKEN:-4.0}
      - OUTLIER_Z_LIMIT=${OUTLIER_Z_LIMIT:-3.0}
      - MAX_ATTEMPTS_PER_CHUNK=${MAX_ATTEMPTS_PER_CHUNK:-3}
      - CHUNK_HTTP_TIMEOUT=${CHUNK_HTTP_TIMEOUT:-300}
      - SAMPLES_PER_TOKEN_SEED=${SAMPLES_PER_TOKEN_SEED:-}
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
