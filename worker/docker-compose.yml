services:
  tts-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reeder-tts-worker
    restart: unless-stopped
    ports:
      - "8100:8100"       # Reeder compatibility endpoint
      - "8080:8080"       # audio.cpp WebUI / Arena
    volumes:
      - ${VOICES_DIR:-../voices}:/data/voices:ro
      - ${MODELS_DIR:-./models}:/models
    environment:
      - ACTIVE_TTS_MODEL=${ACTIVE_TTS_MODEL:-qwen3-tts}
      - AUDIOCPP_BACKEND=${AUDIOCPP_BACKEND:-cuda}
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
