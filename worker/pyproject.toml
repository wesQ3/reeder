[project]
name = "reeder-tts-worker"
version = "0.1.0"
description = "GPU TTS worker for Reeder"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.13.0",
    "pydantic>=2",
    "numpy>=2",
    "soundfile>=0.12.0",
    "qwen-tts",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" },
]
torchaudio = [
    { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reeder"]
