[project]
name = "reeder-tts-worker"
version = "0.2.0"
description = "audio.cpp compatibility worker for Reeder"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
