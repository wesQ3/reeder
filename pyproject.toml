[project]
name = "reeder"
version = "0.1.0"
description = "Personal TTS RSS service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=1.6.0",
    "qwen-tts",
    "torch",
    "soundfile",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
reeder-process = "reeder.cli:process_main"
reeder-feed = "reeder.cli:feed_main"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reeder"]
