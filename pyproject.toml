[project]
name = "reeder"
version = "0.1.0"
description = "Personal TTS RSS service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=1.6.0",
    "qwen-tts",
    "torch",
    "soundfile",
    "numpy",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
reeder-process = "reeder.cli:process_main"
reeder-feed = "reeder.cli:feed_main"
reeder-orchestrator = "reeder.orchestrator:main"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reeder"]
